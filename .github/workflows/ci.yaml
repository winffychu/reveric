name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  # Keep in sync with .fvmrc and .github/workflows/build.yaml.
  FLUTTER_VERSION: '0b771a584214b44aa1f94f9707f2756207356f41'
  FLUTTER_CHANNEL: 'master'

jobs:
  analyze-and-test:
    # Supported platforms are Windows, macOS and Android (see AGENTS.md).
    # Golden files are captured on macOS, and the plugin tests need a locally
    # built fjs dylib, so macOS is the only runner that can run the suite.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Git config for codegen
        run: |
          git config --global user.name 'reveric-ci'
          git config --global user.email 'reveric-ci@users.noreply.github.com'

      - name: Install dependencies
        run: flutter pub get

      # Generated .g.dart / .drift.dart files are committed, so codegen must
      # be a no-op on a clean checkout; a diff proves a stale or missing
      # generated file.
      - name: Verify codegen is up to date
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
          if [ -n "$(git status --porcelain -- '*.g.dart' '*.drift.dart' '*.freezed.dart' '*.json.dart')" ]; then
            echo '::error::Generated files are out of date. Run make codegen and commit the results.'
            git status --porcelain -- '*.g.dart' '*.drift.dart' '*.freezed.dart' '*.json.dart'
            exit 1
          fi

      # Local Flutter SDK is unavailable for some contributors: upload the
      # regenerated outputs so the freshness failure can be fixed without a
      # local SDK.
      - name: Upload regenerated outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-outputs
          path: |
            lib/**/*.g.dart
            lib/**/*.drift.dart
            test/**/*.g.dart
          if-no-files-found: ignore

      # Errors and warnings fail the build; infos are reported but tolerated
      # because flutter analyze treats them as fatal by default and the repo
      # carries ~460 pre-existing infos (mostly third/ vendored code).
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Same runtime build as build.yaml: plugin tests load the compiled fjs
      # dylib through FJS_PROBE_LIBRARY (see plugins/README.md). Tests must
      # run serially, never in parallel shards.
      - name: Build fjs runtime
        run: bash third/fjs/tool/build_runtime.sh

      - name: Test
        run: |
          export FJS_PROBE_LIBRARY="$PWD/third/fjs/build/darwin-xcframework/rust/aarch64-apple-darwin/release/libfjs.dylib"
          flutter test -j 1 --reporter expanded
